id = "promote-nightly-parser-subset"
title = "Promote Nightly Parser Coverage"
purpose = "Move grammar coverage into the authoritative nightly parser while keeping accepted syntax no-fallback."
last_updated = "2026-05-20"
doc = "PROMOTE-NIGHTLY-PARSER-SUBSET.md"
skill = "skills/styio-parser-subset/skill.toml"

steps = [
  "freeze representative accepted and rejected source samples",
  "extend token/start gates before parser consumption",
  "implement nightly expr or stmt parsing with existing helpers",
  "preserve line-boundary and statement-boundary behavior",
  "add no-fallback, parser-entry, and error-boundary tests",
]

required_evidence = [
  "accepted samples parse through the hand-written nightly parser without fallback",
  "rejected samples fail with stable parser or semantic errors",
  "shadow route stats report zero accepted-grammar fallback",
  "parser entry audit still passes",
]

gates = [
  "cmake --build build/default --target styio_security_test styio -j2",
  "ctest --test-dir build/default -R ^StyioParserEngine\\. --output-on-failure",
  "ctest --test-dir build/default -R ^parser_shadow_gate_ --output-on-failure",
  "ctest --test-dir build/default -R ^parser_legacy_entry_audit$ --output-on-failure",
  "ctest --test-dir build/default -R '^(StyioDiagnostics\\.SyntaxCheckRejectsNonAuthoritativeParserEngine|StyioSemanticBridge\\.RejectsMalformedInputWithoutRecovery)$' --output-on-failure",
  "git diff --check",
]

[handoff]
report = [
  "accepted samples",
  "rejected samples",
  "no-fallback evidence",
  "changed parser surfaces",
]
