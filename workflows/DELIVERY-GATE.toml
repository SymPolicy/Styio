id = "delivery-gate"
title = "Styio Unified Delivery Gate"
purpose = "Define the common delivery-floor entrypoint for local, branch, local-info leak, audit, and checkpoint health checks."
last_updated = "2026-06-28"
doc = "DELIVERY-GATE.md"

commands = [
  "./scripts/delivery-gate.sh",
  "./scripts/delivery-gate.sh --skip-health",
  "./scripts/delivery-gate.sh --mode push --base origin/main --range origin/main..HEAD",
  "./scripts/delivery-gate.sh --mode release",
  "./scripts/delivery-gate.sh --coverage-build-dir build/coverage --coverage-threshold 95",
]

delegates = [
  "functional commit readiness prompt",
  "tool and skill registry",
  "local-info leak gate",
  "repo hygiene",
  "workflow scheduler",
  "external audit",
  "checkpoint health",
  "coverage gate",
]
