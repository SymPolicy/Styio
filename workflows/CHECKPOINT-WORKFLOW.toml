id = "checkpoint-workflow"
title = "Checkpoint Workflow"
purpose = "Constrain checkpoint scope, recovery, review boundaries, and verification."
last_updated = "2026-10-01"
doc = "CHECKPOINT-WORKFLOW.md"

required_package = [
  "implementation and tests when affected",
  "current owning documentation",
  "decision rationale when needed",
  "recovery evidence for unfinished work",
]

rules = [
  "one independently reviewable checkpoint goal",
  "checkpoint delivery must be buildable testable revertible and recoverable",
  "preserve applicable migration and shadow gates with explicit exit conditions",
  "registered plan state and generated projections retain their owning writers",
  "promote durable recovery content before lifecycle cleanup",
  "delivery goes through DELIVERY-GATE.toml",
]
