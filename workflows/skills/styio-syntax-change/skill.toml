[skill]
name = "styio-syntax-change"
display_name = "Styio Syntax Change"
description = "Use when adding, changing, or reserving Styio syntax, operators, tokens, grammar, parser behavior, IDE highlighting, semantic lowering, or syntax-facing docs/tests in styio-nightly."
last_updated = "2026-07-30"

workflow = [
  "create or update exactly one distributed feature SSOT and state canonical reserved and rejected examples",
  "declare document roles dependencies prerequisites owner and lifecycle states",
  "run the syntax feature graph generator and state gate before implementation",
  "check references/syntax-change-surface.md",
  "update token definitions and both tokenizers before parser behavior",
  "update the authoritative nightly parser path and keep retired parser-route audit evidence non-authoritative",
  "add semantic/type/IR behavior or fail closed",
  "update compact syntax docs, EBNF, symbol reference, language design, and affected team runbooks",
  "add focused lexer/parser/security tests plus runtime smoke",
  "run gates from workflows/ADD-SYNTAX-WITH-SKILLS.toml",
]

constraints = [
  "treat the feature Markdown document as the feature SSOT and generated graphs as read-only projections",
  "do not advance implementation unless decision is accepted and derived readiness is ready",
  "declare every dependency and prerequisite instead of relying on document reading order",
  "prefer existing parser helpers and AST shapes",
  "do not accept new syntax through retired fallback routes",
  "hide internal sentinel names behind typed errors",
  "do not let postfix/infix syntax consume the next statement across a line break unless explicitly designed",
  "treat docs and tests as part of the syntax change",
  "do not record developer-machine or server-machine paths, account names, private endpoints, or deployment roots; use placeholders such as <workspace-root>, <user-home>, <server-host>, or environment variables",
]

completion_report = [
  "feature SSOT path and lifecycle states",
  "dependency and prerequisite closure",
  "accepted forms and reserved forms",
  "supported lowering vs fail-closed paths",
  "docs updated",
  "local/server info placeholder check",
  "tests and gates run",
]

references = [
  "references/syntax-change-surface.md",
]
