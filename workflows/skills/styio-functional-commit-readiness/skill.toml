[skill]
name = "styio-functional-commit-readiness"
display_name = "Styio Functional Commit Readiness"
description = "Use after implementing, refactoring, optimizing, or migrating a Styio feature and before commit, branch handoff, final validation, or delivery-gate evidence so the feature is a self-contained commit unit with targeted validation, upstream/downstream adaptation, cutover status, and objective unable-to-verify records."
last_updated = "2026-09-08"

workflow = [
  "state the single feature unit this commit delivers",
  "check references/commit-readiness-surface.md",
  "run the smallest targeted command that proves the feature behavior",
  "debug upstream producers and input shapes against the changed behavior",
  "debug downstream callers and consumers against the changed behavior",
  "run feature cutover if the work replaces, migrates, broadens, or retires old behavior",
  "confirm changed feature, module, workflow, skill, and doc names use the feature or transformation result instead of version-style names",
  "reuse unchanged focused evidence and run staged process gates according to scope",
  "run the required complete regression once after source review, in-scope repairs, and focused verification finish",
  "complete the committer self-check from evidence and prepare STYIO_COMMIT_READINESS_CONFIRMED=1 for an already-authorized non-interactive commit only when true",
  "record objective unable-to-verify blockers before handoff or commit",
]

constraints = [
  "do not commit a functional change that only works in isolation while callers remain unadapted",
  "do not use a broad gate as the only evidence when a targeted feature command exists",
  "do not record unable-to-verify without the skipped surface, blocker, owner, substitute evidence, and follow-up gate",
  "do not commit version-style names such as v2, version, new, old, legacy, or latest for the changed feature unit",
  "do not record developer-machine or server-machine paths, account names, private endpoints, or deployment roots; use placeholders such as <workspace-root>, <user-home>, <server-host>, or environment variables",
  "do not mix a committable feature unit with unrelated half-finished work",
  "do not ask the user to repeat an approval or verify discoverable facts for the committer self-check; preserve separate explicit approval requirements",
  "do not automatically repair or rerun after a complete-regression failure; submit a concrete repair and verification proposal for the developer's decision",
  "do not call a delivery complete while required acceptance remains unverified; continue independent authorized work while a necessary decision is pending",
]

completion_report = [
  "feature unit",
  "upstream surfaces verified",
  "downstream surfaces verified",
  "targeted command and result",
  "integration command and result",
  "feature cutover result or not applicable",
  "version-style naming check result",
  "local/server info placeholder check",
  "unverified surfaces or none",
]

references = [
  "references/commit-readiness-surface.md",
]
