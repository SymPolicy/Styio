[[module_coverage]]
module = "Frontend"
runbook = "docs/teams/FRONTEND-RUNBOOK.md"
tool_ids = ["benchmark-parser-shadow-suite-gate", "benchmark-parser-shadow-suite-gate-python", "parser-retired-route-audit", "parser-retired-route-audit-python"]
maintenance_command = "ctest --test-dir build/default -R '^(StyioParserEngine\\.|parser_shadow_gate_|parser_legacy_entry_audit$)' --output-on-failure"

[[module_coverage]]
module = "Sema / IR"
runbook = "docs/teams/SEMA-IR-RUNBOOK.md"
tool_ids = ["checkpoint-health"]
maintenance_command = "ctest --test-dir build/default -R 'typeinfer|lowering|resource_topology' --output-on-failure"

[[module_coverage]]
module = "Codegen / Runtime"
runbook = "docs/teams/CODEGEN-RUNTIME-RUNBOOK.md"
tool_ids = ["runtime-surface-gate", "checkpoint-health"]
maintenance_command = "ctest --test-dir build/default -L styio_pipeline --output-on-failure"

[[module_coverage]]
module = "CLI / Nano"
runbook = "docs/teams/CLI-NANO-RUNBOOK.md"
tool_ids = ["source-build-minimal", "gen-styio-nano-profile"]
maintenance_command = "ctest --test-dir build/default -R 'Nano|StyioDiagnostics' --output-on-failure"

[[module_coverage]]
module = "IDE / LSP"
runbook = "docs/teams/IDE-LSP-RUNBOOK.md"
tool_ids = ["ide-quality-gate", "ide-perf-gate", "ide-fuzz-gate"]
maintenance_command = "bash scripts/ide-quality-gate.sh --skip-perf --skip-fuzz --waiver local-focused-pass"

[[module_coverage]]
module = "Grammar"
runbook = "docs/teams/GRAMMAR-RUNBOOK.md"
tool_ids = ["ide-quality-gate"]
maintenance_command = "cd grammar/tree-sitter-styio && npx --yes tree-sitter-cli@0.26.8 generate"

[[module_coverage]]
module = "Test Quality"
runbook = "docs/teams/TEST-QUALITY-RUNBOOK.md"
tool_ids = ["coverage-gate", "fuzz-regression-pack", "checkpoint-health", "benchmark-parser-shadow-suite-gate", "benchmark-parser-shadow-suite-gate-python"]
maintenance_command = "ctest --test-dir build/default -L language_feature --output-on-failure"

[[module_coverage]]
module = "Performance / Stability"
runbook = "docs/teams/PERF-STABILITY-RUNBOOK.md"
tool_ids = ["benchmark-perf-route", "benchmark-soak-minimize", "benchmark-perf-report", "benchmark-compare"]
maintenance_command = "STYIO_BENCHMARK_ROOT=/path/to/styio-benchmark ./benchmark/perf-route.sh --quick"

[[module_coverage]]
module = "Docs / Ecosystem"
runbook = "docs/teams/DOCS-ECOSYSTEM-RUNBOOK.md"
tool_ids = ["docs-gate", "workflow-scheduler", "tool-skill-registry-gate", "repo-hygiene-gate"]
maintenance_command = "python3 scripts/tool-skill-registry-gate.py && ./scripts/docs-gate.sh"
