id = "tool-skill-registry-gate"
title = "Tool And Skill Registry Gate"
purpose = "Validate the current repo-local skill and maintenance-tool inventory before delivery or release."
last_updated = "2026-06-28"
doc = "TOOL-SKILL-REGISTRY-GATE.md"
current_state_review_date = "2026-06-28"

commands = [
  "python3 scripts/tool-skill-registry-gate.py",
]

required_skill_ids = [
  "styio-env-bootstrap",
  "styio-file-onboarding",
  "styio-parser-subset",
  "styio-resource-identifier-change",
  "styio-syntax-change",
]

forbidden_tool_paths = [
  "extend_tests.py",
  "scripts/parser-shadow-suite-gate.sh",
  "scripts/perf-route.sh",
  "scripts/soak-minimize.sh",
  "scripts/ecosystem-product-gate.py",
  "scripts/ecosystem-sample-workflow-gate.py",
]

forbidden_active_markers = [
  "MIGRATION-NEEDED",
  "Compatibility wrapper",
  "retained for one release cycle",
  "silently exits 0",
]

