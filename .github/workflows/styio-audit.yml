name: styio-audit

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: styio-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STYIO_PYTHON_VERSION: "3.13.5"

    steps:
      - name: Checkout styio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: styio

      - name: Checkout released styio-audit policy
        uses: actions/checkout@v5
        with:
          repository: eBioRing/styio-audit
          ref: stable
          path: styio-audit

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Fetch managed branch evidence
        working-directory: styio
        run: |
          for branch in stable nightly ai-dev; do
            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done

      - name: Normalize released audit policy for current source layout
        working-directory: styio
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy = Path("../styio-audit/for-styio/module.json")
          text = policy.read_text()
          text = text.replace(
              "StyioIDE and StyioLSP editor-facing workspace services",
              "StyioServices/StyioIDE and StyioServices/StyioLSP editor-facing workspace services",
          )
          text = text.replace(
              '"scope_globs": ["src/StyioIDE/**", "src/StyioLSP/**", "tests/ide/**"]',
              '"scope_globs": ["src/StyioServices/StyioIDE/**", "src/StyioServices/StyioLSP/**", "tests/ide/**"]',
          )
          text = text.replace(
              '"scope_globs": ["src/StyioAST/**", "src/StyioAnalyzer/**", "src/StyioIR/**", "src/StyioCodeGen/**", "tests/styio_test.cpp"]',
              '"scope_globs": ["src/StyioAST/**", "src/StyioSema/**", "src/StyioIR/**", "src/StyioCodeGen/**", "tests/styio_test.cpp"]',
          )
          policy.write_text(text)
          PY

      - name: Run released styio-audit gate
        working-directory: styio
        run: |
          git -C ../styio-audit rev-parse HEAD
          python3 ../styio-audit/bin/styio-audit gate --repo . --project styio
