name: styio-ci-gate

on:
  pull_request:
    branches: [nightly, stable, release]
  push:
    branches: [nightly, stable, release]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.route.outputs.tier }}
      stable_run: ${{ steps.route.outputs.stable_run }}
      required_platforms: ${{ steps.route.outputs.required_platforms }}
      matrix: ${{ steps.route.outputs.matrix }}
      pafio_sha: ${{ steps.route.outputs.pafio_sha }}
      vityo_sha: ${{ steps.route.outputs.vityo_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: styio-nightly
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - name: Validate promotion route and select missing-scope platforms
        id: route
        working-directory: styio-nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/promotion-ci.py --route
      - name: Test admission, reuse, examples and toolchain contracts
        working-directory: styio-nightly
        run: python3 -m unittest discover -s tests -p 'promotion_*_test.py'
      - uses: actions/checkout@v5
        with:
          repository: SymPolicy/Pafio
          ref: ${{ steps.route.outputs.pafio_sha }}
          path: styio-pafio
      - uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/vityo-nightly
          ref: ${{ steps.route.outputs.vityo_sha }}
          path: styio-view
      - name: Preserve existing current-change prebuild policy checks
        working-directory: styio-nightly
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/workflow-scheduler.py run --profile ci-prebuild

  validate:
    name: promotion / ${{ matrix.platform }}
    needs: route
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: styio-nightly
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: styio-nightly
      - uses: actions/checkout@v5
        with:
          repository: SymPolicy/Pafio
          ref: ${{ needs.route.outputs.pafio_sha }}
          path: styio-pafio
      - uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/vityo-nightly
          ref: ${{ needs.route.outputs.vityo_sha }}
          path: styio-view
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev lld-18 llvm-18-dev libicu-dev
          python3 -m pip install 'cmake==3.31.6'
          echo 'STYIO_LLVM_ROOT=/usr/lib/llvm-18' >> "$GITHUB_ENV"
          echo 'CC=clang-18' >> "$GITHUB_ENV"
          echo 'CXX=clang++-18' >> "$GITHUB_ENV"
      - name: macOS native dependencies
        if: matrix.platform == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install llvm@18 icu4c@78 ninja
          python3 -m pip install 'cmake==3.31.6'
          echo "STYIO_LLVM_ROOT=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
          echo "CC=$(brew --prefix llvm@18)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@18)/bin/clang++" >> "$GITHUB_ENV"
          echo "ICU_ROOT=$(brew --prefix icu4c@78)" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Windows compiler environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Windows LLVM development dependencies
        if: matrix.platform == 'windows'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: styio-llvm18
          cache-environment: true
          create-args: >-
            cmake=3.31.6 ninja llvm=18.1.8 llvmdev=18.1.8
            clang-tools=18.1.8 zlib=1.3.2 zstd=1.5.7 libxml2-devel=2.15.3
      - name: Resolve Windows native toolchain
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX 'envs\styio-llvm18'
          $root = Join-Path $prefix 'Library'
          if (!(Test-Path "$root\lib\cmake\llvm\LLVMConfig.cmake")) { throw 'LLVM development package missing' }
          Add-Content $env:GITHUB_PATH "$root\bin"
          Add-Content $env:GITHUB_PATH "$prefix\Scripts"
          Add-Content $env:GITHUB_ENV "STYIO_LLVM_ROOT=$root"
          Add-Content $env:GITHUB_ENV "STYIO_LLVM_DIR=$root\lib\cmake\llvm"
          Add-Content $env:GITHUB_ENV 'CC=cl'
          Add-Content $env:GITHUB_ENV 'CXX=cl'
          $git = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $git)
          $bash = Join-Path $gitRoot 'bin\bash.exe'
          if (!(Test-Path $bash)) { throw 'Verified Git for Windows Bash is required by the test fixtures' }
          Add-Content $env:GITHUB_ENV "STYIO_TEST_BASH=$bash"
          $nativeTmp = Join-Path (Get-Location).Drive.Root 'tmp'
          New-Item -ItemType Directory -Force $nativeTmp | Out-Null
          Add-Content $env:GITHUB_ENV "STYIO_TEST_NATIVE_TMP=$nativeTmp"


      - name: Execute only missing validation or consume stable payload
        env:
          GH_TOKEN: ${{ github.token }}
          STYIO_STABLE_SOURCE_RUN: ${{ needs.route.outputs.stable_run }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python scripts/promotion-ci.py --tier '${{ needs.route.outputs.tier }}' --platform '${{ matrix.platform }}'
      - name: Preserve current-candidate evidence and advisory findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: promotion-evidence-${{ matrix.platform }}
          path: |
            styio-nightly/build/promotion-evidence/evidence.json
            styio-nightly/build/promotion-evidence/report.md
            styio-nightly/build/promotion-evidence/ctest-results.xml
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      - name: Preserve trusted incremental build state
        if: success() && needs.route.outputs.tier != 'release'
        uses: actions/upload-artifact@v6
        with:
          name: promotion-build-${{ matrix.platform }}
          path: styio-nightly/build/promotion-evidence/build.tar.gz
          retention-days: 90
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - name: Preserve sealed distribution payload
        if: success() && needs.route.outputs.tier != 'nightly'
        uses: actions/upload-artifact@v6
        with:
          name: promotion-payload-${{ matrix.platform }}
          path: styio-nightly/build/promotion-evidence/payload.tar.gz
          retention-days: 90
          overwrite: true
          compression-level: 0
          if-no-files-found: error

  required-ci-gate:
    # Existing Ruleset identity remains stable. No separate report-only gate.
    name: styio-ci-gate
    if: always()
    needs: [route, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: styio-nightly
      - name: Require real platform outcomes
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          test "$ROUTE_RESULT" = success
          test "$VALIDATION_RESULT" = success
      - name: Collect actual candidate evidence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --pattern 'promotion-evidence-*' --dir evidence
      - name: Admit this candidate and all required platforms
        if: always() && needs.route.result == 'success'
        env:
          STYIO_REQUIRED_PLATFORMS: ${{ needs.route.outputs.required_platforms }}
        working-directory: styio-nightly
        run: python3 scripts/promotion-ci.py --tier '${{ needs.route.outputs.tier }}' --aggregate ../evidence
      - name: Final admission report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: promotion-admission
          path: |
            evidence/admission.json
            evidence/admission.md
          if-no-files-found: warn
