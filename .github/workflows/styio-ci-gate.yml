name: styio-ci-gate

on:
  pull_request:
  push:
    branches:
      - release
      - nightly
      - stable

jobs:
  styio-ci-gate:
    name: platform-adaptation / linux-ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: styio-nightly

      - name: Resolve ecosystem lane
        id: lane
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET_LANE="${{ github.base_ref }}"
          else
            TARGET_LANE="${{ github.ref_name }}"
          fi

          case "$TARGET_LANE" in
            release|stable|nightly)
              ECOSYSTEM_REF="$TARGET_LANE"
              ;;
            *)
              ECOSYSTEM_REF="nightly"
              ;;
          esac

          echo "target_lane=$TARGET_LANE" >> "$GITHUB_OUTPUT"
          echo "ecosystem_ref=$ECOSYSTEM_REF" >> "$GITHUB_OUTPUT"

      - name: Check out pafio-nightly sibling repository
        uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/pafio-nightly
          ref: ${{ steps.lane.outputs.ecosystem_ref }}
          path: pafio-nightly

      - name: Check out Vityo sibling repository
        uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/vityo-nightly
          ref: ${{ steps.lane.outputs.ecosystem_ref }}
          path: vityo-nightly

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Run workflow scheduler prebuild chain
        shell: bash
        working-directory: styio-nightly
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/workflow-scheduler.py run --profile ci-prebuild

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-18 \
            libclang-rt-18-dev \
            lld-18 \
            llvm-18-dev \
            libicu-dev \
            python3
          python3 -m pip install "cmake==3.31.6"

      - name: Configure
        working-directory: styio-nightly
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DSTYIO_ENABLE_FUZZ=ON

      - name: Build
        working-directory: styio-nightly
        run: >
          cmake --build build/ci --target
          styio styio_test styio_algorithm_equivalence_test
          styio_lspd styio_security_test styio_resource_topology_test styio_ide_test
          styio_newparser_internal_test styio_parser_internal_test
          styio_platform_internal_test styio_native_interop_internal_test
          styio_fuzz_suite

      - name: Docs audit
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L docs --output-on-failure --no-tests=error

      - name: Security tests
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L security --output-on-failure --no-tests=error

      - name: Tree-sitter IDE tests
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L ide --output-on-failure --no-tests=error

      - name: Five-layer pipeline tests
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L styio_pipeline --output-on-failure --no-tests=error

      - name: LSP transport smoke
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -R '^styio_lspd_stdio_framing$' --output-on-failure --no-tests=error

      - name: Parser shadow gate (scalar expressions suite + artifacts)
        working-directory: styio-nightly
        run: |
          mkdir -p build/ci/parser-shadow-artifacts
          ./benchmark/parser-shadow-suite-gate.sh ./build/ci/bin/styio ./tests/features/scalar_expressions ./build/ci/parser-shadow-artifacts

      - name: Parser shadow gate (functions suite + artifacts)
        working-directory: styio-nightly
        run: |
          mkdir -p build/ci/parser-shadow-artifacts-m2
          ./benchmark/parser-shadow-suite-gate.sh ./build/ci/bin/styio ./tests/features/functions ./build/ci/parser-shadow-artifacts-m2

      - name: Upload parser shadow artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: parser-shadow-artifacts
          path: |
            styio-nightly/build/ci/parser-shadow-artifacts
            styio-nightly/build/ci/parser-shadow-artifacts-m2
          if-no-files-found: ignore

      - name: Language feature smoke
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -R '^scalar_expressions_t01_int_arith$|^functions_t01_simple_func$' --output-on-failure --no-tests=error

      - name: Fuzz smoke
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L fuzz_smoke --output-on-failure --no-tests=error

  macos-ci-gate:
    name: platform-adaptation / macos-ci-gate
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Install pinned build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install llvm@18 icu4c@78 ninja
          python3 -m pip install "cmake==3.31.6"

      - name: Resolve and validate the macOS toolchain
        id: toolchain
        shell: bash
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@18)"
          ICU_PREFIX="$(brew --prefix icu4c@78)"
          LLVM_VERSION="$("$LLVM_PREFIX/bin/llvm-config" --version)"

          if [[ "$LLVM_VERSION" != 18.1.* ]]; then
            echo "Styio requires LLVM 18.1.x; found $LLVM_VERSION" >&2
            exit 1
          fi

          echo "llvm_prefix=$LLVM_PREFIX" >> "$GITHUB_OUTPUT"
          echo "icu_prefix=$ICU_PREFIX" >> "$GITHUB_OUTPUT"
          echo "sdk_path=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Configure native macOS build
        run: |
          cmake -S . -B build/macos-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="${{ steps.toolchain.outputs.llvm_prefix }}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${{ steps.toolchain.outputs.llvm_prefix }}/bin/clang++" \
            -DCMAKE_OSX_SYSROOT="${{ steps.toolchain.outputs.sdk_path }}" \
            -DLLVM_DIR="${{ steps.toolchain.outputs.llvm_prefix }}/lib/cmake/llvm" \
            -DCMAKE_PREFIX_PATH="${{ steps.toolchain.outputs.llvm_prefix }};${{ steps.toolchain.outputs.icu_prefix }}" \
            -DICU_ROOT="${{ steps.toolchain.outputs.icu_prefix }}" \
            -DSTYIO_USE_ICU=ON \
            -DSTYIO_ENABLE_TREE_SITTER=ON

      - name: Build native macOS targets
        run: >
          cmake --build build/macos-ci --parallel 4 --target
          styio styio_nano styio_lspd styio_test styio_security_test
          styio_resource_topology_test styio_ide_test
          styio_algorithm_equivalence_test styio_newparser_internal_test
          styio_parser_internal_test styio_platform_internal_test
          styio_native_interop_internal_test

      - name: Run macOS platform and native interop tests
        run: |
          ctest --test-dir build/macos-ci -R '^styio_platform_internal_test$' --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -R '^native_interop_' --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -R '^styio_build_native_executable_stdin_echo$' --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -R '^bootstrap_dev_env_dependency_scope$' --output-on-failure --no-tests=error

      - name: Run macOS compiler and service gates
        run: |
          ctest --test-dir build/macos-ci -L docs --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -L security --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -L styio_pipeline --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -L resource_topology --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -L algorithm_equivalence --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -L ide --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -R '^styio_lspd_stdio_framing$' --output-on-failure --no-tests=error
          ctest --test-dir build/macos-ci -R '^scalar_expressions_t01_int_arith$|^functions_t01_simple_func$' --output-on-failure --no-tests=error

  test-smoke:
    name: test / smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 libclang-rt-18-dev lld-18 llvm-18-dev libicu-dev python3
          python3 -m pip install "cmake==3.31.6"

      - name: Configure smoke build
        run: >
          cmake -S . -B build/smoke -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DSTYIO_ENABLE_FUZZ=ON

      - name: Build smoke targets
        run: cmake --build build/smoke --target styio styio_test styio_fuzz_suite

      - name: Run smoke tests
        run: |
          ctest --test-dir build/smoke -R '^scalar_expressions_t01_int_arith$|^functions_t01_simple_func$' --output-on-failure --no-tests=error
          ctest --test-dir build/smoke -L fuzz_smoke --output-on-failure --no-tests=error

  test-golden-standard:
    name: test / golden-standard
    needs: [styio-ci-gate, test-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Install golden-standard dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 libclang-rt-18-dev lld-18 llvm-18-dev libicu-dev python3
          python3 -m pip install "cmake==3.31.6"

      - name: Configure golden-standard build
        run: >
          cmake -S . -B build/golden -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build golden-standard targets
        run: >
          cmake --build build/golden --target
          styio styio_test styio_algorithm_equivalence_test
          styio_resource_topology_test styio_newparser_internal_test
          styio_parser_internal_test styio_platform_internal_test

      - name: Run syntax feature document-state gate
        run: python3 scripts/syntax-feature-state-gate.py

      - name: Run milestone goldens
        run: ctest --test-dir build/golden -L golden_standard --output-on-failure --no-tests=error

      - name: Run five-layer and convergence goldens
        run: ctest --test-dir build/golden -L styio_pipeline --output-on-failure --no-tests=error

      - name: Run parser shadow convergence gates
        run: ctest --test-dir build/golden -R '^parser_shadow_gate_' --output-on-failure --no-tests=error

      - name: Run parser legacy entry audit
        run: ctest --test-dir build/golden -R '^parser_legacy_entry_audit$' --output-on-failure --no-tests=error
