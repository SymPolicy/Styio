name: styio-ci-gate

on:
  pull_request:
  push:
    branches:
      - ai-dev
      - nightly
      - stable
      - main
      - master
      - agent-dev

jobs:
  styio-ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: styio-nightly

      - name: Resolve ecosystem lane
        id: lane
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET_LANE="${{ github.base_ref }}"
          else
            TARGET_LANE="${{ github.ref_name }}"
          fi

          case "$TARGET_LANE" in
            ai-dev|nightly|stable|main)
              ECOSYSTEM_REF="nightly"
              ;;
            *)
              ECOSYSTEM_REF="nightly"
              ;;
          esac

          echo "target_lane=$TARGET_LANE" >> "$GITHUB_OUTPUT"
          echo "ecosystem_ref=$ECOSYSTEM_REF" >> "$GITHUB_OUTPUT"

      - name: Check out styio-spio sibling repository
        uses: actions/checkout@v5
        with:
          repository: styio-org/styio-spio
          ref: ${{ steps.lane.outputs.ecosystem_ref }}
          path: styio-spio

      - name: Check out styio-view sibling repository
        uses: actions/checkout@v5
        with:
          repository: styio-org/styio-view
          ref: ${{ steps.lane.outputs.ecosystem_ref }}
          path: styio-view

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Run workflow scheduler prebuild chain
        shell: bash
        working-directory: styio-nightly
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/workflow-scheduler.py run --profile ci-prebuild

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-18 \
            libclang-rt-18-dev \
            lld-18 \
            llvm-18-dev \
            libicu-dev \
            zlib1g-dev \
            libzstd-dev \
            libcurl4-openssl-dev \
            python3

      - name: Configure
        working-directory: styio-nightly
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DSTYIO_ENABLE_FUZZ=ON

      - name: Build
        working-directory: styio-nightly
        run: >
          cmake --build build/ci --target
          styio styio_test styio_algorithm_equivalence_test
          styio_security_test styio_resource_topology_test styio_ide_test
          styio_fuzz_suite

      - name: Docs audit
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L docs --output-on-failure

      - name: Security tests
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L security --output-on-failure

      - name: Five-layer pipeline tests
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L styio_pipeline --output-on-failure

      - name: Parser shadow gate (scalar expressions suite + artifacts)
        working-directory: styio-nightly
        run: |
          mkdir -p build/ci/parser-shadow-artifacts
          ./benchmark/parser-shadow-suite-gate.sh ./build/ci/bin/styio ./tests/features/scalar_expressions ./build/ci/parser-shadow-artifacts

      - name: Parser shadow gate (functions suite + artifacts)
        working-directory: styio-nightly
        run: |
          mkdir -p build/ci/parser-shadow-artifacts-m2
          ./benchmark/parser-shadow-suite-gate.sh ./build/ci/bin/styio ./tests/features/functions ./build/ci/parser-shadow-artifacts-m2

      - name: Upload parser shadow artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: parser-shadow-artifacts
          path: |
            styio-nightly/build/ci/parser-shadow-artifacts
            styio-nightly/build/ci/parser-shadow-artifacts-m2
          if-no-files-found: ignore

      - name: Soak smoke tests
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L soak_smoke --output-on-failure

      - name: Language feature smoke
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -R '^scalar_expressions_t01_int_arith$|^functions_t01_simple_func$' --output-on-failure

      - name: Source coverage gate
        working-directory: styio-nightly
        run: >
          scripts/coverage-gate.sh
          --build-dir build/coverage
          --threshold 95
          --llvm-cov llvm-cov-18
          --llvm-profdata llvm-profdata-18
          --cc clang-18
          --cxx clang++-18

      - name: Fuzz smoke
        working-directory: styio-nightly
        run: ctest --test-dir build/ci -L fuzz_smoke --output-on-failure

  styio-windows-native:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: styio-nightly

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Set up MSVC command environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake, Ninja, and LLVM 18 development package
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: styio-llvm18
          cache-environment: true
          create-args: >-
            cmake
            ninja
            llvm=18.1.8
            llvmdev=18.1.8
            clang-tools=18.1.8

      - name: Locate LLVM 18
        shell: pwsh
        run: |
          $condaPrefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs\styio-llvm18"
          if (!(Test-Path $condaPrefix) -and $env:CONDA_PREFIX) {
            $condaPrefix = $env:CONDA_PREFIX
          }
          if (!(Test-Path $condaPrefix)) {
            throw "micromamba environment was not found"
          }

          $llvmRoot = Join-Path $condaPrefix "Library"
          $llvmConfig = Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"
          if (!(Test-Path $llvmConfig)) {
            throw "LLVMConfig.cmake was not found in $llvmRoot"
          }
          $clang = Join-Path $llvmRoot "bin\clang.exe"
          $clangCl = Join-Path $llvmRoot "bin\clang-cl.exe"
          if (!(Test-Path $clang) -and !(Test-Path $clangCl)) {
            throw "neither clang.exe nor clang-cl.exe was found in $llvmRoot\bin"
          }

          $llvmDir = Split-Path -Parent $llvmConfig

          Add-Content $env:GITHUB_PATH (Join-Path $llvmRoot "bin")
          Add-Content $env:GITHUB_PATH (Join-Path $condaPrefix "Scripts")
          Add-Content $env:GITHUB_ENV "LLVM_DIR=$llvmDir"
          Add-Content $env:GITHUB_ENV "STYIO_NATIVE_TOOLCHAIN_ROOT=$llvmRoot"

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          python --version
          where.exe cl
          clang --version

      - name: Configure
        shell: pwsh
        working-directory: styio-nightly
        run: >
          cmake -S . -B build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DLLVM_DIR="$env:LLVM_DIR"
          -DSTYIO_NATIVE_TOOLCHAIN_ROOT="$env:STYIO_NATIVE_TOOLCHAIN_ROOT"
          -DSTYIO_NATIVE_TOOLCHAIN_MODE=auto

      - name: Build
        shell: pwsh
        working-directory: styio-nightly
        run: |
          cmake --build build/windows --target all
          cmake --build build/windows --target styio styio_lspd styio-nano styio_test

      - name: Test
        shell: pwsh
        working-directory: styio-nightly
        run: ctest --test-dir build/windows --output-on-failure
